<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elemental AR</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }

    #canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
    }

    #hud {
      position: fixed;
      top: 16px; left: 16px;
      z-index: 10;
      pointer-events: none;
      font-family: 'Courier New', monospace;
      color: white;
    }

    .card {
      background: rgba(0,0,0,0.58);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 8px;
      min-width: 165px;
    }

    .card h3 {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(255,255,255,0.38);
      margin-bottom: 4px;
    }

    #spell-label {
      font-size: 22px;
      font-weight: bold;
      color: rgba(255,255,255,0.25);
      transition: color 0.25s;
    }

    #gesture-label {
      font-size: 13px;
      color: rgba(255,255,255,0.65);
    }

    .controls {
      font-size: 11px;
      line-height: 2;
      color: rgba(255,255,255,0.55);
    }

    #preview-canvas {
      position: fixed;
      bottom: 16px; right: 16px;
      width: 160px; height: 120px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 6px;
      z-index: 10;
      background: #111;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div id="hud">
    <div class="card">
      <h3>Element</h3>
      <div id="spell-label">—</div>
    </div>
    <div class="card">
      <h3>Gesture</h3>
      <div id="gesture-label">—</div>
    </div>
    <div class="card controls">
      <h3>Spells</h3>
      ✋ open palm &rarr; Wind<br>
      ✊ fist &rarr; Earth<br>
      ☝️ point &rarr; Lightning<br>
      🤏 pinch &rarr; Ice<br>
      ✌️ peace &rarr; Fire
    </div>
  </div>

  <canvas id="preview-canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="spells.js"></script>
  <script src="app.js"></script>

</body>
</html>
