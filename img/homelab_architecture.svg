<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-label="Architecture of the self-hosted app platform">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#55627a"/>
    </marker>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .box { fill:#ffffff; stroke:#c3cbdb; stroke-width:1.5; }
      .accent { fill:#f3eefc; stroke:#cbbcf0; stroke-width:1.5; }
      .strip { fill:#f7f9fc; stroke:#e1e6ef; stroke-width:1.5; }
      .t { font-size:17px; font-weight:600; fill:#0a1530; }
      .s { font-size:13px; fill:#55627a; }
      .lane { font-size:12px; font-weight:600; letter-spacing:.12em; fill:#5426b0; }
      .chip-t { font-size:12.5px; fill:#3a2a6a; font-weight:500; }
      .cap { font-size:12px; fill:#8a94a8; }
      .edge { stroke:#55627a; stroke-width:1.6; fill:none; }
      .dash { stroke:#9b6ff0; stroke-width:1.6; fill:none; stroke-dasharray:5 5; }
    </style>
  </defs>

  <!-- RUNTIME lane -->
  <text class="lane" x="40" y="46">RUNTIME</text>

  <!-- phone -->
  <rect class="box" x="40" y="70" width="150" height="92" rx="12"/>
  <text class="t" x="115" y="110" text-anchor="middle">Phone / browser</text>
  <text class="s" x="115" y="132" text-anchor="middle">installable PWA</text>

  <!-- caddy -->
  <rect class="accent" x="240" y="58" width="180" height="116" rx="12"/>
  <text class="t" x="330" y="94" text-anchor="middle">Caddy</text>
  <text class="s" x="330" y="115" text-anchor="middle">reverse proxy</text>
  <text class="s" x="330" y="146" text-anchor="middle">Authelia SSO ·</text>
  <text class="s" x="330" y="163" text-anchor="middle">per-user identity</text>

  <!-- app containers -->
  <rect class="box" x="470" y="52" width="690" height="128" rx="12"/>
  <text class="t" x="488" y="82">App containers</text>
  <text class="s" x="640" y="82">FastAPI · SQLite · installable PWA</text>
  <!-- chips row 1 -->
  <g>
    <rect class="accent" x="488" y="96" width="104" height="26" rx="13"/><text class="chip-t" x="540" y="113" text-anchor="middle">RecipeAgent</text>
    <rect class="accent" x="600" y="96" width="86" height="26" rx="13"/><text class="chip-t" x="643" y="113" text-anchor="middle">JobAgent</text>
    <rect class="accent" x="694" y="96" width="64" height="26" rx="13"/><text class="chip-t" x="726" y="113" text-anchor="middle">Echo</text>
    <rect class="accent" x="766" y="96" width="76" height="26" rx="13"/><text class="chip-t" x="804" y="113" text-anchor="middle">Eureka</text>
    <rect class="accent" x="850" y="96" width="84" height="26" rx="13"/><text class="chip-t" x="892" y="113" text-anchor="middle">Artemis</text>
    <rect class="accent" x="942" y="96" width="68" height="26" rx="13"/><text class="chip-t" x="976" y="113" text-anchor="middle">Aura</text>
    <rect class="accent" x="1018" y="96" width="64" height="26" rx="13"/><text class="chip-t" x="1050" y="113" text-anchor="middle">Muse</text>
  </g>
  <!-- chips row 2 -->
  <g>
    <rect class="accent" x="488" y="130" width="82" height="26" rx="13"/><text class="chip-t" x="529" y="147" text-anchor="middle">Idea Jar</text>
    <rect class="accent" x="578" y="130" width="60" height="26" rx="13"/><text class="chip-t" x="608" y="147" text-anchor="middle">Bell</text>
    <rect class="accent" x="646" y="130" width="104" height="26" rx="13"/><text class="chip-t" x="698" y="147" text-anchor="middle">dashboard</text>
    <rect class="accent" x="758" y="130" width="72" height="26" rx="13"/><text class="chip-t" x="794" y="147" text-anchor="middle">+ more</text>
  </g>

  <!-- runtime arrows -->
  <path class="edge" d="M190 116 H236" marker-end="url(#ah)"/>
  <path class="edge" d="M420 116 H466" marker-end="url(#ah)"/>

  <!-- SERVICES lane -->
  <text class="lane" x="470" y="236">SHARED SERVICES</text>
  <rect class="box" x="470" y="250" width="210" height="96" rx="12"/>
  <text class="t" x="575" y="286" text-anchor="middle">Ollama</text>
  <text class="s" x="575" y="307" text-anchor="middle">local LLMs · Llama 3.1</text>
  <text class="s" x="575" y="324" text-anchor="middle">structured JSON output</text>

  <rect class="box" x="700" y="250" width="220" height="96" rx="12"/>
  <text class="t" x="810" y="286" text-anchor="middle">Hosted APIs</text>
  <text class="s" x="810" y="307" text-anchor="middle">Claude · Gemini · Bedrock</text>
  <text class="cap" x="810" y="324" text-anchor="middle">optional fallback</text>

  <rect class="box" x="940" y="250" width="220" height="96" rx="12"/>
  <text class="t" x="1050" y="286" text-anchor="middle">/data volumes</text>
  <text class="s" x="1050" y="307" text-anchor="middle">SQLite · Postgres</text>
  <text class="cap" x="1050" y="324" text-anchor="middle">survive every deploy</text>

  <!-- services arrows -->
  <path class="edge" d="M575 180 V246" marker-end="url(#ah)"/>
  <path class="edge" d="M810 180 V246" marker-end="url(#ah)"/>
  <path class="edge" d="M1050 180 V246" marker-end="url(#ah)"/>

  <!-- DELIVERY lane -->
  <rect class="strip" x="40" y="410" width="1120" height="150" rx="14"/>
  <text class="lane" x="62" y="444">DELIVERY · GITOPS</text>

  <rect class="box" x="62" y="468" width="176" height="64" rx="12"/>
  <text class="t" x="150" y="497" text-anchor="middle">git push</text>
  <text class="s" x="150" y="517" text-anchor="middle">to main</text>

  <rect class="box" x="292" y="468" width="176" height="64" rx="12"/>
  <text class="t" x="380" y="497" text-anchor="middle">Gitea Actions</text>
  <text class="s" x="380" y="517" text-anchor="middle">CI</text>

  <rect class="box" x="522" y="468" width="166" height="64" rx="12"/>
  <text class="t" x="605" y="497" text-anchor="middle">Docker build</text>
  <text class="s" x="605" y="517" text-anchor="middle">image per commit</text>

  <rect class="accent" x="742" y="468" width="210" height="64" rx="12"/>
  <text class="t" x="847" y="497" text-anchor="middle">deploy</text>
  <text class="s" x="847" y="517" text-anchor="middle">+ health check</text>

  <!-- delivery arrows -->
  <path class="edge" d="M238 500 H288" marker-end="url(#ah)"/>
  <path class="edge" d="M468 500 H518" marker-end="url(#ah)"/>
  <path class="edge" d="M688 500 H738" marker-end="url(#ah)"/>

  <!-- redeploy loop back to app containers (routed over the top, clear of every box) -->
  <path class="dash" d="M952 500 H1180 V40 H1066 V50" marker-end="url(#ah)"/>
  <text class="cap" x="1174" y="33" text-anchor="end">redeploys</text>
</svg>
