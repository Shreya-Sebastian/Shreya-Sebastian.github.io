<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-label="Bar chart of average precision on held-out months: baseline 0.50, gradient-boosted trees 0.69">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .title { font-size:18px; font-weight:600; fill:#0a1530; }
      .sub { font-size:13px; fill:#8a94a8; }
      .axis { stroke:#c3cbdb; stroke-width:1.5; }
      .grid { stroke:#e7ebf4; stroke-width:1; }
      .tick { font-size:12.5px; fill:#55627a; }
      .blabel { font-size:14px; fill:#0a1530; font-weight:500; }
      .val { font-size:16px; font-weight:700; fill:#0a1530; }
    </style>
  </defs>

  <text class="title" x="60" y="34">Average precision on held-out months</text>
  <text class="sub" x="60" y="54">single category, rolling time split (train on earlier months, test on later)</text>

  <!-- gridlines + y ticks (0 to 0.8) -->
  <g>
    <line class="grid" x1="150" y1="350" x2="660" y2="350"/>
    <line class="grid" x1="150" y1="277.5" x2="660" y2="277.5"/>
    <line class="grid" x1="150" y1="205" x2="660" y2="205"/>
    <line class="grid" x1="150" y1="132.5" x2="660" y2="132.5"/>
    <line class="grid" x1="150" y1="60" x2="660" y2="60"/>
    <text class="tick" x="140" y="354" text-anchor="end">0.0</text>
    <text class="tick" x="140" y="281.5" text-anchor="end">0.2</text>
    <text class="tick" x="140" y="209" text-anchor="end">0.4</text>
    <text class="tick" x="140" y="136.5" text-anchor="end">0.6</text>
    <text class="tick" x="140" y="64" text-anchor="end">0.8</text>
  </g>

  <!-- axes -->
  <line class="axis" x1="150" y1="60" x2="150" y2="350"/>
  <line class="axis" x1="150" y1="350" x2="660" y2="350"/>

  <!-- bars -->
  <rect x="215" y="169" width="130" height="181" rx="4" fill="#cdbdf0"/>
  <rect x="465" y="100" width="130" height="250" rx="4" fill="#5426b0"/>

  <!-- value labels -->
  <text class="val" x="280" y="159" text-anchor="middle">0.50</text>
  <text class="val" x="530" y="90" text-anchor="middle">0.69</text>

  <!-- bar labels -->
  <text class="blabel" x="280" y="374" text-anchor="middle">Baseline</text>
  <text class="blabel" x="530" y="374" text-anchor="middle">Gradient-boosted trees</text>
</svg>
